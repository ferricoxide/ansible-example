---
- name: Keep hosts up to date
  hosts: all
  gather_facts: true
  ignore_unreachable: true
  vars_files:
    - vars/default.yml
  tasks:
    - name: Ensure system's RPMs are up to date
      become: true
      become_flags: "-r unconfined_r -t unconfined_t"
      ansible.builtin.yum:
        name: '*'
        state: latest
        update_only: true

    - name: Reboot required
      become: true
      ansible.builtin.command: "/usr/bin/needs-restarting -r"
      register: reboot_required
      ignore_errors: true
      changed_when: false
      failed_when:
        - reboot_required.rc == 2
      when:
        - ansible_facts['distribution_major_version'] >= "7"

    - name: Rebooting
      become: true
      ansible.builtin.reboot:
        post_reboot_delay: 60
      throttle: 1
      when:
        - reboot_required.rc == 1
        - ansible_facts ['virtualization_role'] != 'host'
...
